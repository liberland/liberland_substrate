name: Run contracts tests

on:
  pull_request:
    paths:
      - "contracts/**"
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C debug-assertions=y"
      RUST_BACKTRACE: 1
    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.9.1
        with:
          access_token: ${{ github.token }}

      - name: Install Rust toolchain
        run: |
          rustup set profile minimal
          rustup update --no-self-update 1.89.0
          rustup component add --toolchain 1.89.0 rustfmt rust-src
          rustup target add wasm32-unknown-unknown
          rustup default 1.89.0

      - name: Checkout
        uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          workspaces: "contracts -> contracts/target"

      - name: Run tests
        working-directory: contracts
        # --locked fails the build if Cargo.lock is stale or missing entries, instead of
        # silently re-resolving to the newest crates on every run.
        run: cargo test --locked
